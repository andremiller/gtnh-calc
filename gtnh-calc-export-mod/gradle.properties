# GTNH starter tooling is pinned in settings.gradle.kts and gradle/wrapper/.
gtnh.settings.blowdryerTag =
gtnh.settings.dynamicSpotlessVersion = false
gtnh.modules.codeStyle = false
gtnh.modules.gitVersion = false
gtnh.modules.publishing = false

modName = GTNH Calc Export
modId = gtnh_calc_export
modGroup = tools.gtnh.calc.export
modVersion = 0.2.1
useModGroupForPublishing = true

minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# Native Java 21 bytecode; GTNH's modern Java installation is required.
enableModernJavaSyntax = modern
forceToolchainVersion = 21
enableGenericInjection = true
generateGradleTokenClass = tools.gtnh.calc.export.Tags
gradleTokenVersion = VERSION

autoUpdateBuildScript = false
usesMixins = false
usesShadowedDependencies = true
usesMavenPublishing = false
includeWellKnownRepositories = false
curseForgeEnvironments = client

org.gradle.configuration-cache = true
org.gradle.parallel = true

# JNI symbols name the original com.luciad classes; relocation breaks native calls.
relocateShadowedDependencies = false
minimizeShadowedDependencies = false
